<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#1a1f2e"/>
  <!-- Step indicators -->
  <circle cx="80" cy="60" r="14" fill="#4b8af4"/>
  <text x="80" y="65" text-anchor="middle" fill="white" font-size="13" font-weight="bold" font-family="sans-serif">1</text>
  <line x1="94" y1="60" x2="166" y2="60" stroke="#3a4560" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="180" cy="60" r="14" fill="#3a4560"/>
  <text x="180" y="65" text-anchor="middle" fill="#6b7a99" font-size="13" font-family="sans-serif">2</text>
  <line x1="194" y1="60" x2="266" y2="60" stroke="#3a4560" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="280" cy="60" r="14" fill="#3a4560"/>
  <text x="280" y="65" text-anchor="middle" fill="#6b7a99" font-size="13" font-family="sans-serif">3</text>
  <line x1="294" y1="60" x2="306" y2="60" stroke="#3a4560" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="320" cy="60" r="14" fill="#3a4560"/>
  <text x="320" y="65" text-anchor="middle" fill="#6b7a99" font-size="13" font-family="sans-serif">4</text>
  <!-- Step labels -->
  <text x="80" y="86" text-anchor="middle" fill="#4b8af4" font-size="9" font-family="sans-serif">Cart</text>
  <text x="180" y="86" text-anchor="middle" fill="#6b7a99" font-size="9" font-family="sans-serif">Shipping</text>
  <text x="280" y="86" text-anchor="middle" fill="#6b7a99" font-size="9" font-family="sans-serif">Payment</text>
  <text x="320" y="86" text-anchor="middle" fill="#6b7a99" font-size="9" font-family="sans-serif">Done</text>
  <!-- Main panel -->
  <rect x="32" y="104" width="228" height="260" rx="10" fill="#252d3d"/>
  <!-- Cart items -->
  <rect x="48" y="120" width="196" height="56" rx="6" fill="#1e2535"/>
  <rect x="56" y="130" width="36" height="36" rx="4" fill="#e06060" opacity="0.7"/>
  <rect x="100" y="134" width="80" height="8" rx="3" fill="#4a556a"/>
  <rect x="100" y="146" width="50" height="7" rx="3" fill="#3a4358"/>
  <text x="220" y="152" text-anchor="middle" fill="#c4c9da" font-size="11" font-family="sans-serif">$49</text>
  <rect x="48" y="184" width="196" height="56" rx="6" fill="#1e2535"/>
  <rect x="56" y="194" width="36" height="36" rx="4" fill="#5588ee" opacity="0.7"/>
  <rect x="100" y="198" width="90" height="8" rx="3" fill="#4a556a"/>
  <rect x="100" y="210" width="55" height="7" rx="3" fill="#3a4358"/>
  <text x="220" y="216" text-anchor="middle" fill="#c4c9da" font-size="11" font-family="sans-serif">$29</text>
  <!-- Divider -->
  <rect x="48" y="252" width="196" height="1" fill="#2e3850"/>
  <!-- Total -->
  <text x="56" y="272" fill="#7a8aaa" font-size="11" font-family="sans-serif">Subtotal</text>
  <text x="236" y="272" text-anchor="end" fill="#c4c9da" font-size="11" font-family="sans-serif">$78.00</text>
  <text x="56" y="288" fill="#7a8aaa" font-size="11" font-family="sans-serif">Shipping</text>
  <text x="236" y="288" text-anchor="end" fill="#55c070" font-size="11" font-family="sans-serif">Free</text>
  <rect x="48" y="296" width="196" height="1" fill="#2e3850"/>
  <text x="56" y="314" fill="#c4c9da" font-size="12" font-weight="bold" font-family="sans-serif">Total</text>
  <text x="236" y="314" text-anchor="end" fill="#c4c9da" font-size="12" font-weight="bold" font-family="sans-serif">$78.00</text>
  <!-- Button -->
  <rect x="48" y="328" width="196" height="28" rx="6" fill="#4b8af4"/>
  <text x="146" y="347" text-anchor="middle" fill="white" font-size="12" font-family="sans-serif">Continue to Shipping</text>
  <!-- Side summary box -->
  <rect x="272" y="104" width="96" height="120" rx="8" fill="#252d3d"/>
  <rect x="280" y="116" width="80" height="7" rx="3" fill="#4a556a"/>
  <rect x="280" y="130" width="60" height="7" rx="3" fill="#3a4358"/>
  <rect x="280" y="144" width="70" height="7" rx="3" fill="#3a4358"/>
  <rect x="280" y="164" width="80" height="1" fill="#2e3850"/>
  <text x="280" y="180" fill="#7a8aaa" font-size="9" font-family="sans-serif">Order total</text>
  <text x="352" y="180" text-anchor="end" fill="#c4c9da" font-size="9" font-family="sans-serif">$78</text>
</svg>
