<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <rect width="400" height="400" fill="#0d0f18"/>
  <!-- Mark: abstract geometric logo -->
  <g transform="translate(120, 110)">
    <!-- Outer hexagonal shape -->
    <polygon points="80,0 155,44 155,132 80,176 5,132 5,44" fill="none" stroke="#4b8af4" stroke-width="3"/>
    <!-- Inner shape -->
    <polygon points="80,28 128,56 128,112 80,140 32,112 32,56" fill="#4b8af4" opacity="0.15"/>
    <!-- Center mark -->
    <rect x="62" y="70" width="36" height="36" rx="6" fill="#4b8af4"/>
    <rect x="70" y="78" width="8" height="8" rx="2" fill="white" opacity="0.9"/>
    <rect x="82" y="78" width="8" height="20" rx="2" fill="white" opacity="0.9"/>
    <rect x="70" y="90" width="8" height="8" rx="2" fill="white" opacity="0.7"/>
  </g>
  <!-- Wordmark -->
  <text x="200" y="324" text-anchor="middle" fill="#c4c9da" font-size="32" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" letter-spacing="8">ACME</text>
  <!-- Tagline -->
  <text x="200" y="348" text-anchor="middle" fill="#4b6a99" font-size="11" font-family="-apple-system, BlinkMacSystemFont, sans-serif" letter-spacing="4">DESIGN STUDIO</text>
  <!-- Divider line -->
  <rect x="160" y="304" width="80" height="1" fill="#2e3850"/>
  <!-- Color palette dots -->
  <circle cx="168" cy="368" r="7" fill="#4b8af4"/>
  <circle cx="186" cy="368" r="7" fill="#55c070"/>
  <circle cx="204" cy="368" r="7" fill="#e0a855"/>
  <circle cx="222" cy="368" r="7" fill="#e06060"/>
  <circle cx="240" cy="368" r="7" fill="#9b6be0"/>
</svg>
