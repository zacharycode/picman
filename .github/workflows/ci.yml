name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run stress:create -- --count=25000 --folders=120 --output=/tmp/picman-ci-stress --clean
      - run: npm run stress:audit -- --library=/tmp/picman-ci-stress --min-count=25000

  rust:
    runs-on: macos-14
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --locked
      - run: node ../scripts/create-stress-library.mjs --count=25000 --folders=120 --output=/tmp/picman-ci-stress --clean
      - run: PICMAN_STRESS_LIBRARY=/tmp/picman-ci-stress cargo test --locked stress_library_scan_from_env -- --ignored --nocapture
